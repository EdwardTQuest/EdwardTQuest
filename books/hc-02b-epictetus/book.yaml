blurb: Epictetus was born a slave and became the teacher of emperors. He left nothing in writing;
  his pupil Arrian took down the lectures, and from them Hastings Crossley drew these sayings
  for the Harvard Classics. They are bracing rather than consoling. What is in our power,
  and what is not; the part we are given to play; the God within, who sees the shut door.
  Few books say so much in so few pages, and none says it more plainly. This edition follows
  the 1909 setting, with the Hymn of Cleanthes.
