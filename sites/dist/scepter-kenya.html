<style>
/* The shared shop. Each house sets its tokens in theme.css; nothing here names a colour. */

:root { --bar-h: 68px; --shelves-h: 65px; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--bar-h) + var(--shelves-h) + 12px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--text); font-feature-settings: "kern", "liga"; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
img, svg { display: block; max-width: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 3px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: var(--radius); font: 600 14px var(--ui); }
.skip:focus { top: 12px; }
.muted { color: var(--ink-2); font-weight: 400; }

/* ---------- bar ---------- */
.bar { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 20px; height: var(--bar-h); padding: 0 max(20px, calc((100vw - 1360px) / 2)); background: var(--paper); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--ink); }
.brand-mark { width: 22px; flex: none; color: var(--brand-mark, var(--accent-strong)); }
.brand-word { font-family: var(--display); font-size: var(--word-size, 1.35rem); font-weight: var(--word-weight, 400); letter-spacing: var(--word-track, 0.02em); text-transform: var(--word-case, none); line-height: 1; white-space: nowrap; }
.brand-word small { display: inline-block; margin-left: 0.55em; font: 600 0.62rem/1 var(--ui); letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-2); vertical-align: 0.28em; }
.brand-logo { height: 34px; width: auto; }
.search { position: relative; justify-self: center; width: min(100%, 440px); }
.search svg { position: absolute; left: 14px; top: 50%; width: 18px; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.search input { width: 100%; height: 42px; padding: 0 16px 0 42px; border: 1px solid color-mix(in srgb, var(--ink-2) 35%, var(--line)); border-radius: 999px; background: var(--paper-2); font: 400 15px var(--ui); transition: border-color .2s, background .2s; }
.search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.search input:focus { border-color: var(--ink-2); background: var(--paper); }
.search input::placeholder { color: var(--ink-2); }
.search input::-webkit-search-cancel-button { filter: grayscale(1); }
.fmt[hidden] { display: none; }
.fmt { display: flex; padding: 3px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); }
.fmt button { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 999px; font: 600 13px var(--ui); color: var(--ink-2); transition: background .2s, color .2s; }
.fmt button svg { width: 17px; }
.fmt button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.bag-btn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--ink); transition: background .2s; }
.bag-btn:hover { background: var(--paper-2); }
.bag-btn svg { width: 23px; }
.bag-count { position: absolute; top: 3px; right: 1px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 700 11px/19px var(--ui); text-align: center; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; background: var(--deep); color: var(--deep-ink); isolation: isolate; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--hero-glow, none); }
.hero-art { position: absolute; z-index: -1; right: -6vw; top: -18%; width: min(1000px, 86vw); aspect-ratio: 2 / 3; opacity: var(--hero-art-opacity, 0.5); --cv-ac: var(--hero-line, var(--accent)); --cv-fg: var(--deep-ink); }
.hero-art svg { width: 100%; height: 100%; }
.hero-art { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 38%); mask-image: linear-gradient(90deg, transparent 0, #000 38%); }
.hero-inner { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: end; gap: 40px; min-height: min(86vh, 780px); max-width: 1360px; margin: 0 auto; padding: clamp(56px, 9vh, 110px) 20px clamp(48px, 8vh, 96px); }
.hero-copy { align-self: center; max-width: 34rem; }
.eyebrow { display: inline-block; font: 600 12px/1.2 var(--ui); letter-spacing: 0.24em; text-transform: uppercase; color: var(--eyebrow, var(--accent-strong)); }
.hero, .foot { --focus: var(--accent); }
.hero .eyebrow { color: var(--hero-eyebrow, var(--accent)); }
.hero-title { margin: 18px 0 30px; font-family: var(--display); font-weight: var(--hero-weight, 400); font-size: var(--hero-size, clamp(3.6rem, 10.5vw, 8.6rem)); line-height: 0.9; letter-spacing: var(--hero-track, -0.02em); text-transform: var(--hero-case, none); }
.hero-title small { display: block; margin-top: 0.3em; font-size: 0.34em; letter-spacing: 0.02em; opacity: 0.85; }
.hero-title em { font-style: var(--hero-em, italic); color: var(--hero-em-color, inherit); }
.hero-line { display: flex; flex-wrap: wrap; gap: 8px 22px; font: 500 15px var(--ui); color: var(--deep-ink-2); }
.hero-line span { display: inline-flex; align-items: center; gap: 8px; }
.hero-line svg { width: 20px; color: var(--hero-eyebrow, var(--accent)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 50px; padding: 0 24px; border-radius: var(--radius); font: 600 15px var(--ui); letter-spacing: 0.01em; transition: transform .2s, background .2s, box-shadow .2s, opacity .2s; }
.btn svg { width: 18px; }
.btn-hero { margin-top: 34px; background: var(--accent); color: var(--accent-ink); }
.btn-hero:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -10px rgba(0, 0, 0, .5); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .6); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-wide { width: 100%; }

/* The ascent: flagship titles climbing to the upper right. */
.ascent { position: relative; display: flex; align-items: flex-end; justify-content: flex-end; height: 100%; min-height: 420px; padding-right: 8px; }
.step { position: relative; flex: 0 0 auto; width: clamp(92px, 9.6vw, 144px); margin-left: clamp(10px, 1.1vw, 16px); margin-bottom: calc(var(--i) * clamp(28px, 4.4vw, 62px)); transform-origin: bottom center; transition: transform .35s cubic-bezier(.2, .7, .2, 1); z-index: calc(var(--i) + 1); }
.step:first-child { margin-left: 0; }
.step::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 1px; background: var(--hero-ledge, color-mix(in srgb, var(--deep-ink) 30%, transparent)); }
.step .cover:not(.cv-set) { box-shadow: 0 30px 50px -22px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .3); }
.step:hover { transform: translateY(-10px); }
.ready .step { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(120ms + var(--i) * 90ms); }
@keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }

/* ---------- shelves ---------- */
.shelves { position: sticky; top: var(--bar-h); z-index: 15; background: color-mix(in srgb, var(--paper) 94%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.shelves-in { display: flex; gap: 8px; max-width: 1360px; margin: 0 auto; padding: 12px 20px; overflow-x: auto; scrollbar-width: none; scroll-padding: 0 20px; }
.shelves-in::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); font: 600 14px var(--ui); white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.chip span { font-weight: 500; font-size: 12px; color: var(--ink-2); }
.chip:hover { border-color: var(--ink-2); }
.chip[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-current="true"] span { color: color-mix(in srgb, var(--paper) 70%, transparent); }

/* ---------- catalogue ---------- */
.catalogue { max-width: 1360px; margin: 0 auto; padding: 8px 20px 96px; scroll-margin-top: calc(var(--bar-h) + var(--shelves-h) - 1px); outline: none; }
.shelf { padding-top: 52px; }
.shelf-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px; }
.shelf-head h2 { font-family: var(--display); font-weight: var(--h2-weight, 400); font-size: clamp(1.7rem, 3.2vw, 2.4rem); line-height: 1.05; letter-spacing: var(--h2-track, -0.01em); }
.shelf-head .count { font: 600 13px var(--ui); color: var(--ink-2); }
.shelf-head::after { content: ""; flex: 1; height: 1px; align-self: center; background: linear-gradient(90deg, var(--line), transparent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 40px 28px; }
.card { display: flex; flex-direction: column; gap: 14px; }
.card-body { flex: 1; display: flex; flex-direction: column; }
.card-cover { transition: transform .35s cubic-bezier(.2, .7, .2, 1); }
.card-cover .cover { transition: box-shadow .35s; }
.card:hover .card-cover { transform: translateY(-6px); }
.card:hover .cover:not(.cv-set) { box-shadow: inset 3px 0 0 rgba(0, 0, 0, .16), 0 26px 40px -20px rgba(0, 0, 0, .55), 0 2px 5px rgba(0, 0, 0, .18); }
.card-title { font: 600 15px/1.3 var(--ui); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-author { margin-top: 3px; font: 400 14px/1.35 var(--ui); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-price { margin-top: auto; padding-top: 8px; font: 600 15px var(--ui); color: var(--price, var(--ink)); }
.empty { color: var(--ink-2); font: 400 16px var(--ui); }

/* ---------- covers ---------- */
.cover { position: relative; aspect-ratio: 2 / 3; container-type: inline-size; overflow: hidden; background: var(--cv-bg); color: var(--cv-fg); border-radius: 2px 5px 5px 2px; box-shadow: inset 3px 0 0 rgba(0, 0, 0, .16), 0 12px 26px -16px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .18); }
.cover::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0, 0, 0, .14) 0, rgba(255, 255, 255, .07) 2.5%, transparent 7%, transparent 93%, rgba(0, 0, 0, .06)); }
.cv-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.cv-text { position: absolute; left: 10cqw; right: 9cqw; bottom: 19cqw; display: flex; flex-direction: column; gap: 4cqw; }
.cv-author { font: 600 4.3cqw/1.25 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cv-title { font-family: var(--display); font-weight: var(--cover-weight, 400); font-style: var(--cover-style, normal); line-height: 1.02; letter-spacing: var(--cover-track, -0.005em); text-transform: var(--cover-case, none); text-wrap: balance; overflow-wrap: break-word; hyphens: auto; }
.cv-xl { font-size: 18.5cqw; } .cv-l { font-size: 14.5cqw; } .cv-m { font-size: 11.5cqw; } .cv-s { font-size: 9.4cqw; } .cv-xs { font-size: 7.8cqw; }
.cv-mark { position: absolute; left: 10cqw; bottom: 6.5cqw; width: 6.4cqw; color: var(--cv-ac); }
.cv-mark svg { width: 100%; height: auto; --paper: var(--cv-bg); }
.cv-kind { position: absolute; right: 8cqw; bottom: 7.5cqw; font: 700 3.5cqw/1 var(--ui); letter-spacing: 0.16em; text-transform: uppercase; color: var(--cv-fg); opacity: .9; }
@container (max-width: 200px) { .cv-author, .cv-kind { display: none; } }
.cv-booklet::before { content: ""; position: absolute; inset: 4.5cqw; border: 1px solid var(--cv-ac); opacity: .45; pointer-events: none; }
.cv-bible::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2.2cqw; background: var(--cv-ac); opacity: .8; }
.cv-set { box-shadow: inset 3px 0 0 rgba(0, 0, 0, .16), 4px -4px 0 0 color-mix(in srgb, var(--cv-bg) 72%, #000), 8px -8px 0 0 color-mix(in srgb, var(--cv-bg) 52%, #000), 0 12px 26px -16px rgba(0, 0, 0, .55); }

/* ---------- dialogs ---------- */
.dlg { padding: 0; border: 0; color: var(--ink); background: var(--paper); box-shadow: 0 40px 120px -30px rgba(0, 0, 0, .6); overscroll-behavior: contain; }
.dlg::backdrop { background: color-mix(in srgb, var(--deep) 62%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.dlg-book { width: min(1000px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); border-radius: 16px; }
.dlg-book[open] { animation: pop .35s cubic-bezier(.2, .7, .2, 1); }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
.x { position: absolute; top: 14px; right: 14px; z-index: 2; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 999px; background: var(--paper-2); color: var(--ink); transition: background .2s; }
.x:hover { background: var(--line); }
.x svg { width: 20px; }
.bk { display: grid; grid-template-columns: minmax(220px, 330px) minmax(0, 1fr); gap: 48px; padding: 52px 52px 36px; }
.bk-cover { align-self: start; perspective: 1200px; }
.bk-cover .cover { transform: rotateY(-7deg); transform-origin: left center; }
.bk-cover .cover:not(.cv-set) { box-shadow: inset 4px 0 0 rgba(0, 0, 0, .16), 22px 34px 60px -26px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .2); }
.bk-info { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding-top: 6px; }
.bk-info .eyebrow:hover { text-decoration: underline; text-underline-offset: 3px; }
.bk-title { margin-top: 12px; font-family: var(--display); font-weight: var(--h2-weight, 400); font-size: clamp(1.9rem, 3.6vw, 2.9rem); line-height: 1.02; letter-spacing: var(--h2-track, -0.01em); text-wrap: balance; }
.bk-sub { margin-top: 10px; font: italic 400 1.15rem/1.35 var(--text); color: var(--ink-2); }
.bk-author { margin-top: 14px; font: 600 15px var(--ui); }
.bk-desc { margin-top: 20px; max-width: 36rem; font: 400 1.08rem/1.6 var(--text); }
.formats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 34rem; margin: 30px 0 0; padding: 0; border: 0; }
.fopt { position: relative; }
.fopt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.fopt-in { display: grid; gap: 4px; justify-items: start; padding: 14px 14px 13px; border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .2s, box-shadow .2s, background .2s; }
.fopt-in svg { width: 22px; margin-bottom: 4px; color: var(--ink-2); }
.fopt-name { font: 600 14px var(--ui); }
.fopt-price { font: 500 14px var(--ui); color: var(--ink-2); }
.fopt:hover .fopt-in { border-color: var(--ink-2); }
.fopt input:checked + .fopt-in { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--paper-2); }
.fopt input:checked + .fopt-in svg { color: var(--accent-strong); }
.fopt input:checked + .fopt-in .fopt-price { color: var(--ink); font-weight: 600; }
.fopt input:focus-visible + .fopt-in { outline: 2px solid var(--focus); outline-offset: 2px; }
.bk-pending { margin-top: 10px; font: 500 13px var(--ui); color: var(--ink-2); }
.bk-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; width: 100%; max-width: 34rem; }
.bk-actions .btn { flex: 1; min-width: 200px; }
.qty { display: flex; align-items: center; height: 50px; border: 1px solid var(--line); border-radius: var(--radius); }
.qty[hidden] { display: none; }
.qty button { display: grid; place-items: center; width: 42px; height: 100%; color: var(--ink-2); }
.qty button:hover { color: var(--ink); }
.qty button svg { width: 18px; }
.qty output { min-width: 22px; text-align: center; font: 600 15px var(--ui); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 30px; margin: 28px 0 0; padding-top: 18px; border-top: 1px solid var(--line); width: 100%; max-width: 34rem; font: 400 13px var(--ui); }
.meta div { display: flex; gap: 8px; }
.meta dt { color: var(--ink-2); }
.meta dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.bk-more { padding: 26px 52px 44px; border-top: 1px solid var(--line); background: var(--paper-2); }
.bk-more-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; margin-top: 16px; }
.mini { display: block; transition: transform .3s cubic-bezier(.2, .7, .2, 1); }
.mini:hover { transform: translateY(-4px); }

/* basket drawer */
.dlg-bag { margin: 0 0 0 auto; width: min(460px, 100vw); height: 100dvh; max-height: 100dvh; display: none; flex-direction: column; }
.dlg-bag[open] { display: flex; animation: slide .4s cubic-bezier(.2, .7, .2, 1); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.bag-head { position: relative; display: flex; align-items: center; min-height: 76px; padding: 0 24px; border-bottom: 1px solid var(--line); }
.bag-head h2 { font-family: var(--display); font-weight: var(--h2-weight, 400); font-size: 1.7rem; }
.bag-head .x { top: 17px; right: 18px; }
.lines { flex: 1; overflow-y: auto; margin: 0; padding: 8px 24px; list-style: none; }
.line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.line-title { font: 600 15px/1.3 var(--ui); }
.line-fmt { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 500 13px var(--ui); color: var(--ink-2); }
.line-fmt svg { width: 16px; }
.line-ctl { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
.qty-s { height: 34px; }
.qty-s button { width: 32px; }
.link { font: 500 13px var(--ui); color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--ink); }
.line-price { font: 600 15px var(--ui); font-variant-numeric: tabular-nums; }
.line-pending { font: 500 13px var(--ui); color: var(--ink-2); white-space: nowrap; }
.bag-foot { padding: 20px 24px max(24px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--paper-2); }
.total { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; font: 500 15px var(--ui); }
.total strong { font: 400 1.8rem var(--display); }
.bag-note { margin-top: 12px; font: 400 13px var(--ui); color: var(--ink-2); text-align: center; }
.bag-empty { flex: 1; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--ink-2); font: 400 16px var(--ui); }
.bag-empty svg { width: 44px; opacity: .5; }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 60; width: max-content; max-width: calc(100vw - 32px); padding: 13px 20px; border-radius: 22px; text-align: center; background: var(--deep); color: var(--deep-ink); font: 500 14px var(--ui); box-shadow: 0 14px 40px -12px rgba(0, 0, 0, .5); transform: translate(-50%, 30px); opacity: 0; pointer-events: none; transition: transform .35s cubic-bezier(.2, .7, .2, 1), opacity .3s; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }

/* ---------- footer ---------- */
.foot { background: var(--deep); color: var(--deep-ink); }
.foot-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 40px; max-width: 1360px; margin: 0 auto; padding: 64px 20px 40px; }
.foot .brand-mark { width: 30px; color: var(--hero-eyebrow, var(--accent)); }
.foot-brand { display: flex; align-items: center; gap: 12px; }
.foot .brand-word { font-size: 1.7rem; }
.foot .brand-word small { color: var(--deep-ink-2); }
.foot-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px 40px; font: 400 14px/1.7 var(--ui); color: var(--deep-ink-2); }
.foot-col p:first-child { color: var(--deep-ink); font-weight: 600; }
.foot-col a { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }
.foot-note { max-width: 1360px; margin: 0 auto; padding: 18px 20px 30px; border-top: 1px solid color-mix(in srgb, var(--deep-ink) 14%, transparent); font: 400 12px var(--ui); color: var(--deep-ink-2); letter-spacing: 0.02em; }

/* ---------- small screens ---------- */
@media (max-width: 1180px) {
  .shelves-in { gap: 6px; }
  .chip { padding: 0 11px; gap: 6px; }
}
@media (max-width: 1020px) {
  .fmt button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .fmt button { padding: 0 10px; }
  .hero-inner { grid-template-columns: 1fr; align-items: start; gap: 12px; min-height: 0; }
  .ascent { min-height: 0; justify-content: flex-start; padding: 26px 0 0; }
  .step { width: clamp(64px, 15vw, 128px); margin-left: 2vw; margin-bottom: calc(var(--i) * clamp(14px, 3vw, 34px)); }
  .step:first-child { margin-left: 0; }
  .hero-art { width: 130vw; right: -45vw; top: -10%; }
  .bk { grid-template-columns: minmax(160px, 240px) minmax(0, 1fr); gap: 32px; padding: 44px 32px 28px; }
  .bk-more { padding: 22px 32px 32px; }
}
@media (max-width: 720px) {
  :root:root { --bar-h: 64px; --shelves-h: 61px; }
  :root:root:has(.bar.has-fmt) { --bar-h: 119px; }
  .bar { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand search bag"; gap: 10px; padding: 0 12px 0 16px; }
  .bar.has-fmt { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "brand fmt bag" "search search search"; gap: 8px 10px; padding: 10px 16px 12px; }
  .brand { grid-area: brand; }
  .brand-word { font-size: calc(var(--word-size, 1.35rem) * .92); }
  .brand-word small { display: block; margin: 4px 0 0; font-size: .5rem; letter-spacing: .2em; vertical-align: 0; }
  .fmt { grid-area: fmt; }
  .fmt button { height: 40px; min-width: 40px; justify-content: center; }
  .bag-btn { grid-area: bag; }
  .search { grid-area: search; width: 100%; }
  .search input { padding-left: 38px; }
  .search svg { left: 12px; }
  .search input { height: 44px; font-size: 16px; }
  .hero-inner { padding: 44px 16px 40px; }
  .hero-title { margin: 14px 0 18px; }
  .btn-hero { margin-top: 26px; }
  .ascent { padding-top: 30px; }
  .step { width: calc((100% - 8vw) / 5); }
  .qty-s { height: 40px; }
  .qty-s button { width: 40px; }
  .line-ctl .link { padding: 12px 6px; margin: -12px -6px; }
  .shelves-in { padding: 10px 16px; }
  .catalogue { padding: 0 16px 72px; }
  .shelf { padding-top: 38px; }
  .shelf-head { margin-bottom: 20px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 16px; }
  .card { gap: 11px; }
  .card-title { font-size: 14px; }
  .card-author { font-size: 13px; }
  .dlg-book { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
  .dlg-book .x { position: sticky; top: 12px; float: right; margin: 12px 12px -54px 0; }
  .bk { grid-template-columns: 1fr; gap: 22px; padding: 56px 20px 24px; }
  .bk-cover { width: min(44%, 180px); justify-self: center; }
  .bk-cover .cover { transform: none; }
  .bk-title { font-size: 2rem; }
  .formats { gap: 8px; }
  .fopt-in { padding: 12px 10px; }
  .bk-actions .btn { min-width: 0; }
  .bk-more { padding: 20px 20px 36px; }
  .bk-more-row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .bk-more-row .mini:nth-child(n+5) { display: none; }
  .foot-in { grid-template-columns: 1fr; padding: 48px 16px 28px; }
  .foot-note { padding: 16px 16px 28px; }
}
@media (max-width: 380px) {
  .fmt button { padding: 0 8px; }
  .brand-word small { display: none; }
}

/* unpriced: the formats every title comes in */
.fmt-icons { display: inline-flex; gap: 7px; color: var(--ink-2); vertical-align: middle; }
.fmt-icons svg { width: 17px; height: 17px; }
.bag-pending { margin: -8px 0 16px; font: 400 13px var(--ui); color: var(--ink-2); }
.bk-title:focus { outline: none; }

})();
</script>
<script>
/* One bookshop, four houses. Reads window.SITE (brand) and window.CATALOG (books),
   renders the shop, keeps a basket in this browser. Works from file:// — no build step,
   no network, no modules. */
(function () {
  'use strict';

  const SITE = window.SITE, CAT = window.CATALOG;
  const { cover, heroArt, MARKS, esc, typo } = window.Covers;
  const FORMATS = ['print', 'ebook', 'audio'];
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

  const ICON = {
    print: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v-15zM5 19.5A1.5 1.5 0 0 0 6.5 21H19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 7h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    ebook: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2.5" width="13" height="19" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 6.5h6M9 9.5h6M9 12.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="18.2" r="0.9" fill="currentColor"/></svg>',
    audio: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="3.5" y="14" width="4.5" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="16" y="14" width="4.5" height="7" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    bag: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    minus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // ---------- data ----------
  const shelves = CAT.shelves.filter(s => CAT.books.some(b => b.shelf === s.slug));
  const shelfIndex = Object.fromEntries(CAT.shelves.map((s, i) => [s.slug, i]));
  const shelfName = Object.fromEntries(CAT.shelves.map(s => [s.slug, s.name]));
  const byId = new Map(CAT.books.map(b => [b.id, b]));
  // Each house's own order: its lead titles first on every shelf.
  const books = CAT.books.slice();
  const haystack = new Map(books.map(b => [b.id, fold([b.title, b.subtitle, b.author, b.description, shelfName[b.shelf]].join(' '))]));
  function fold(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

  const money = new Intl.NumberFormat(SITE.locale, { style: 'currency', currency: SITE.currency, minimumFractionDigits: SITE.currency === 'KES' || SITE.currency === 'PHP' ? 0 : 2, maximumFractionDigits: 2 });
  const priceOf = (b, f) => (b.price && typeof b.price[f] === 'number' ? b.price[f] : null);
  // The format switch only means something once titles carry prices; until then it stays out of the way.
  const anyPriced = CAT.books.some(b => FORMATS.some(f => priceOf(b, f) != null));
  const show = n => (n == null ? '' : money.format(n));

  // ---------- storage (this browser only; everything still works without it) ----------
  const KEY = 'shop:' + SITE.key;
  function load(k, d) { try { const v = localStorage.getItem(KEY + ':' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } }

  const state = {
    shelf: 'all',
    q: '',
    format: FORMATS.includes(load('format', 'print')) ? load('format', 'print') : 'print',
    basket: (load('basket', []) || []).filter(l => byId.has(l.id) && FORMATS.includes(l.format)),
  };

  // ---------- shell ----------
  const brand = SITE.logo
    ? `<img class="brand-logo" src="${esc(SITE.logo)}" alt="${esc(SITE.name)}">`
    : `<span class="brand-mark">${MARKS[SITE.mark]}</span><span class="brand-word">${SITE.wordmark}</span>`;

  document.body.innerHTML = `
  <a class="skip" href="#catalogue">Skip to books</a>
  <header class="bar${anyPriced ? ' has-fmt' : ''}">
    <a class="brand" href="#/" aria-label="${esc(SITE.name)} — home">${brand}</a>
    <label class="search">${ICON.search}<span class="sr-only">Search books</span>
      <input type="search" id="q" placeholder="Search" autocomplete="off" spellcheck="false"></label>
    <div class="fmt" role="group" aria-label="Show prices for"${anyPriced ? '' : ' hidden'}>
      ${FORMATS.map(f => `<button type="button" data-fmt="${f}" aria-pressed="${f === state.format}" aria-label="${esc(SITE.formats[f])}">${ICON[f]}<span>${esc(SITE.formats[f])}</span></button>`).join('')}
    </div>
    <button type="button" class="bag-btn" id="bag-open" aria-label="Basket">${ICON.bag}<span class="bag-count" id="bag-count" hidden>0</span></button>
  </header>
  <main>
    <section class="hero" aria-label="${esc(SITE.name)}">
      <div class="hero-art">${heroArt(SITE, SITE.key + '-hero')}</div>
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">${esc(SITE.hero.eyebrow)}</p>
          <h1 class="hero-title">${SITE.hero.title}</h1>
          <p class="hero-line">${FORMATS.map(f => `<span>${ICON[f]}${esc(SITE.formats[f])}</span>`).join('')}</p>
          <a class="btn btn-hero" href="#catalogue">${esc(SITE.words.browse)} ${books.length} ${esc(SITE.words.titles)} ${ICON.arrow}</a>
        </div>
        <div class="ascent" aria-hidden="true">${ascent()}</div>
      </div>
    </section>
    <nav class="shelves" aria-label="Shelves"><div class="shelves-in" id="shelves"></div></nav>
    <section class="catalogue" id="catalogue" tabindex="-1" aria-label="${esc(SITE.words.books)}"></section>
    <p class="sr-only" id="status" role="status"></p>
  </main>
  <footer class="foot">
    <div class="foot-in">
      <div class="foot-brand">${brand}</div>
      <div class="foot-cols">${SITE.footer.map(col => `<div class="foot-col">${col.map(l => `<p>${l}</p>`).join('')}</div>`).join('')}</div>
    </div>
    <p class="foot-note">${SITE.note}</p>
  </footer>
  <dialog class="dlg dlg-book" id="dlg-book" aria-labelledby="bk-title"></dialog>
  <dialog class="dlg dlg-bag" id="dlg-bag" aria-labelledby="bag-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>`;

  function ascent() {
    const feat = CAT.books.filter(b => b.featured);
    const pick = feat.concat(books.filter(b => !b.featured)).slice(0, 5);
    return pick.map((b, i) => `<a class="step" href="#/book/${b.id}" tabindex="-1" style="--i:${i};--n:${pick.length}">${cover(b, SITE, shelfIndex[b.shelf] || 0)}</a>`).join('');
  }

  // ---------- catalogue ----------
  // No price yet: show the three formats every title comes in.
  const priceCell = p => (p == null ? `<span class="fmt-icons" title="${esc(FORMATS.map(f => SITE.formats[f]).join(' · '))}">${FORMATS.map(f => ICON[f]).join('')}<span class="sr-only">${esc(FORMATS.map(f => SITE.formats[f]).join(', '))}</span></span>` : show(p));

  function card(b, i) {
    const p = priceOf(b, state.format);
    return `<a class="card" href="#/book/${b.id}" style="--d:${Math.min(i, 16)}">
      <div class="card-cover" aria-hidden="true">${cover(b, SITE, shelfIndex[b.shelf] || 0)}</div>
      <div class="card-body">
        <h3 class="card-title">${esc(b.title)}</h3>
        <p class="card-author">${esc(b.author)}</p>
        <p class="card-price">${priceCell(p)}</p>
      </div></a>`;
  }

  function renderShelves() {
    const counts = Object.fromEntries(shelves.map(s => [s.slug, books.filter(b => b.shelf === s.slug).length]));
    const had = document.activeElement && document.activeElement.matches('#shelves .chip') ? document.activeElement.getAttribute('href') : null;
    $('#shelves').innerHTML =
      `<a href="#/" class="chip" aria-current="${state.shelf === 'all' && !state.q}">${esc(SITE.words.all)}<span>${books.length}</span></a>` +
      shelves.map(s => `<a href="#/shelf/${s.slug}" class="chip" aria-current="${state.shelf === s.slug && !state.q}">${esc(s.name)}<span>${counts[s.slug]}</span></a>`).join('');
    const cur = $('#shelves [aria-current="true"]'), box = $('#shelves');
    if (cur) box.scrollLeft += cur.getBoundingClientRect().left - box.getBoundingClientRect().left - (box.clientWidth - cur.offsetWidth) / 2;
    if (had) { const n = $(`#shelves .chip[href="${had}"]`); if (n) n.focus({ preventScroll: true }); }
  }

  function renderCatalogue() {
    const el = $('#catalogue');
    const q = fold(state.q.trim());
    if (q) {
      const terms = q.split(/\s+/);
      const hits = books.filter(b => terms.every(t => haystack.get(b.id).includes(t)));
      el.innerHTML = `<section class="shelf"><header class="shelf-head"><h2>${hits.length ? `“${esc(state.q.trim())}”` : esc(SITE.words.none)}</h2><span class="count">${hits.length}</span></header>
        ${hits.length ? `<div class="grid">${hits.map(card).join('')}</div>` : `<p class="empty">${esc(SITE.words.noneHint)}</p>`}</section>`;
    } else {
      const list = state.shelf === 'all' ? shelves : shelves.filter(s => s.slug === state.shelf);
      el.innerHTML = list.map(s => {
        const bs = books.filter(b => b.shelf === s.slug);
        return `<section class="shelf" id="shelf-${s.slug}" aria-labelledby="h-${s.slug}">
          <header class="shelf-head"><h2 id="h-${s.slug}">${esc(s.name)}</h2><span class="count">${bs.length}</span></header>
          <div class="grid">${bs.map(card).join('')}</div></section>`;
      }).join('');
    }
    renderShelves();
    const n = q ? el.querySelectorAll('.card').length : books.filter(b => state.shelf === 'all' || b.shelf === state.shelf).length;
    $('#status').textContent = q ? `${n} ${SITE.words.titles}: “${state.q.trim()}”` : state.shelf === 'all' ? '' : `${shelfName[state.shelf]}: ${n} ${SITE.words.titles}`;
  }

  // ---------- book ----------
  let current = null, chosen = 'print', qty = 1, openedInApp = false;

  function renderBook(b) {
    const unpriced = FORMATS.every(f => priceOf(b, f) == null);
    const more = books.filter(x => x.shelf === b.shelf && x.id !== b.id).slice(0, 6);
    const meta = [
      b.isbn && [SITE.words.isbn, esc(b.isbn)],
      b.pages && [SITE.words.pages, String(b.pages)],
    ].filter(Boolean);
    $('#dlg-book').innerHTML = `
      <button type="button" class="x" data-close aria-label="Close">${ICON.close}</button>
      <div class="bk">
        <div class="bk-cover" aria-hidden="true">${cover(b, SITE, shelfIndex[b.shelf] || 0)}</div>
        <div class="bk-info">
          <a class="eyebrow" href="#/shelf/${b.shelf}" data-shelf>${esc(shelfName[b.shelf] || '')}</a>
          <h2 id="bk-title" class="bk-title" tabindex="-1">${typo(b.title)}</h2>
          ${b.subtitle ? `<p class="bk-sub">${typo(b.subtitle)}</p>` : ''}
          ${b.author ? `<p class="bk-author">${esc(b.author)}</p>` : ""}
          ${b.description ? `<p class="bk-desc">${esc(b.description)}</p>` : ''}
          <fieldset class="formats"><legend class="sr-only">Format</legend>
            ${FORMATS.map(f => {
              const p = priceOf(b, f);
              return `<label class="fopt"><input type="radio" name="fmt" value="${f}" ${f === chosen ? 'checked' : ''}>
                <span class="fopt-in">${ICON[f]}<span class="fopt-name">${esc(SITE.formats[f])}</span>${unpriced ? '' : `<span class="fopt-price">${p == null ? '—' : show(p)}</span>`}</span></label>`;
            }).join('')}
          </fieldset>
          ${unpriced ? `<p class="bk-pending">${esc(SITE.words.unpriced)}</p>` : ''}
          <div class="bk-actions">
            <div class="qty" ${chosen === 'print' ? '' : 'hidden'}>
              <button type="button" data-qty="-1" aria-label="One fewer">${ICON.minus}</button>
              <output aria-live="polite">${qty}</output>
              <button type="button" data-qty="1" aria-label="One more">${ICON.plus}</button>
            </div>
            <button type="button" class="btn btn-primary" id="add"></button>
          </div>
          ${meta.length ? `<dl class="meta">${meta.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
        </div>
      </div>
      ${more.length ? `<div class="bk-more"><p class="eyebrow">${esc(SITE.words.more)} ${esc(shelfName[b.shelf] || '')}</p>
        <div class="bk-more-row">${more.map(x => `<a href="#/book/${x.id}" class="mini" data-swap aria-label="${esc(x.title)}">${cover(x, SITE, shelfIndex[x.shelf] || 0)}</a>`).join('')}</div></div>` : ''}`;
    syncAdd();
  }

  function syncAdd() {
    const p = priceOf(current, chosen), btn = $('#add');
    if (!btn) return;
    btn.textContent = p == null ? SITE.words.add : `${SITE.words.add} · ${show(p * (chosen === 'print' ? qty : 1))}`;
    const q = $('.dlg-book .qty');
    if (q) { q.hidden = chosen !== 'print'; q.querySelector('output').textContent = qty; }
  }

  function openBook(id) {
    const b = byId.get(id);
    if (!b) { location.replace('#/'); return; }
    current = b; qty = 1;
    chosen = priceOf(b, state.format) != null ? state.format : (FORMATS.find(f => priceOf(b, f) != null) || state.format);
    renderBook(b);
    const d = $('#dlg-book');
    if (!d.open) d.showModal();
    d.scrollTop = 0;
    $('#bk-title').focus({ preventScroll: true });
    document.title = `${b.title} — ${SITE.name}`;
  }

  function closeBook() {
    const d = $('#dlg-book');
    if (d.open) d.close();
    document.title = SITE.title;
  }

  // ---------- basket ----------
  function bagTotal() { return state.basket.reduce((s, l) => s + (priceOf(byId.get(l.id), l.format) || 0) * l.qty, 0); }
  function bagUnpriced() { return state.basket.filter(l => priceOf(byId.get(l.id), l.format) == null).length; }
  function bagCount() { return state.basket.reduce((s, l) => s + l.qty, 0); }

  function renderBagCount() {
    const n = bagCount(), c = $('#bag-count');
    c.hidden = n === 0; c.textContent = n;
    $('#bag-open').setAttribute('aria-label', `${SITE.words.basket}, ${n}`);
  }

  function renderBag() {
    const lines = state.basket.map((l, i) => {
      const b = byId.get(l.id), p = priceOf(b, l.format);
      return `<li class="line">
        <a href="#/book/${b.id}" class="line-cover" data-from-bag aria-label="${esc(b.title)}">${cover(b, SITE, shelfIndex[b.shelf] || 0)}</a>
        <div class="line-info"><p class="line-title">${esc(b.title)}</p><p class="line-fmt">${ICON[l.format]}${esc(SITE.formats[l.format])}</p>
          <div class="line-ctl">
            ${l.format === 'print' ? `<div class="qty qty-s"><button type="button" data-line="${i}" data-d="-1" aria-label="One fewer">${ICON.minus}</button><output>${l.qty}</output><button type="button" data-line="${i}" data-d="1" aria-label="One more">${ICON.plus}</button></div>` : ''}
            <button type="button" class="link" data-remove="${i}">${esc(SITE.words.remove)}</button></div></div>
        <p class="line-price">${p == null ? `<span class="line-pending">${esc(SITE.words.unpriced)}</span>` : show(p * l.qty)}</p></li>`;
    }).join('');
    $('#dlg-bag').innerHTML = `
      <header class="bag-head"><h2 id="bag-title">${esc(SITE.words.basket)}</h2><button type="button" class="x" data-close aria-label="Close">${ICON.close}</button></header>
      ${state.basket.length ? `<ul class="lines">${lines}</ul>
      <footer class="bag-foot"><p class="total"><span>${esc(SITE.words.total)}</span>${bagUnpriced() === state.basket.length ? `<span class="line-pending">${esc(SITE.words.unpriced)}</span>` : `<strong>${show(bagTotal())}</strong>`}</p>
        ${bagUnpriced() && bagUnpriced() < state.basket.length ? `<p class="bag-pending">${esc(SITE.words.toPrice.replace('{n}', bagUnpriced()))}</p>` : ''}
        <button type="button" class="btn btn-primary btn-wide" id="checkout">${esc(SITE.words.checkout)}</button>
        <p class="bag-note" id="bag-note" role="status"></p></footer>`
      : `<div class="bag-empty">${ICON.bag}<p>${esc(SITE.words.empty)}</p></div>`}`;
  }

  function refocusBag(sel) { const el = $('#dlg-bag ' + sel) || $('#dlg-bag .x'); if (el) el.focus(); }

  function addToBag(b, format, n) {
    const line = state.basket.find(l => l.id === b.id && l.format === format);
    if (line) line.qty = format === 'print' ? line.qty + n : 1;
    else state.basket.push({ id: b.id, format, qty: format === 'print' ? n : 1 });
    save('basket', state.basket);
    renderBagCount();
    toast(`${SITE.words.added} — ${b.title} · ${SITE.formats[format]}`);
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast'), host = document.querySelector('dialog[open]') || document.body;
    if (t.parentNode !== host) host.appendChild(t);
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
  }

  // ---------- routing ----------
  let lastList = '#/', focusCatalogue = false;
  function route() {
    const h = location.hash || '#/';
    const m = h.match(/^#\/book\/([\w-]+)/);
    if (m) { openBook(m[1]); return; }
    closeBook();
    if (h === '#catalogue') return;
    const s = h.match(/^#\/shelf\/([\w-]+)/);
    const next = s && shelves.some(x => x.slug === s[1]) ? s[1] : 'all';
    const changed = next !== state.shelf || state.q;
    lastList = h;
    if (changed) {
      state.shelf = next;
      if (state.q) { state.q = ''; $('#q').value = ''; }
      renderCatalogue();
      if (s) scrollToCatalogue();
    }
    if (focusCatalogue) { focusCatalogue = false; $('#catalogue').focus({ preventScroll: true }); }
  }
  function scrollToCatalogue() {
    const top = $('#catalogue').getBoundingClientRect().top + window.scrollY - stickyOffset();
    if (Math.abs(window.scrollY - top) > 4) window.scrollTo({ top, behavior: reduce() ? 'auto' : 'smooth' });
  }
  const stickyOffset = () => $('.bar').offsetHeight + $('.shelves').offsetHeight;
  const reduce = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const fmtBtn = t.closest('.fmt button');
    if (fmtBtn) {
      state.format = fmtBtn.dataset.fmt; save('format', state.format);
      $$('.fmt button').forEach(b => b.setAttribute('aria-pressed', String(b === fmtBtn)));
      $$('#catalogue .card').forEach(a => {
        const b = byId.get(a.getAttribute('href').slice(7)), p = priceOf(b, state.format);
        a.querySelector('.card-price').innerHTML = priceCell(p);
      });
      return;
    }
    if (t.closest('.card, .step, [data-swap], [data-from-bag]')) {
      const a = t.closest('a');
      if (a && a.hash.startsWith('#/book/')) {
        e.preventDefault();
        if ($('#dlg-bag').open) $('#dlg-bag').close();
        if (location.hash.startsWith('#/book/')) location.replace(a.hash); else { openedInApp = true; location.hash = a.hash; }
      }
      return;
    }
    if (t.closest('[data-shelf]')) { e.preventDefault(); openedInApp = false; focusCatalogue = true; location.hash = t.closest('a').hash; return; }
    if (t.closest('[data-close]')) { const d = t.closest('dialog'); if (d.id === 'dlg-book') leaveBook(); else d.close(); return; }
    if (t.closest('#bag-open')) { renderBag(); $('#dlg-bag').showModal(); return; }
    const dq = t.closest('[data-qty]');
    if (dq) { qty = Math.max(1, Math.min(99, qty + Number(dq.dataset.qty))); syncAdd(); return; }
    if (t.closest('#add')) {
      addToBag(current, chosen, qty); qty = 1; syncAdd(); return;
    }
    const dl = t.closest('[data-line]');
    if (dl) {
      const l = state.basket[Number(dl.dataset.line)];
      l.qty = Math.max(1, Math.min(99, l.qty + Number(dl.dataset.d)));
      save('basket', state.basket); renderBag(); renderBagCount();
      refocusBag(`[data-line="${dl.dataset.line}"][data-d="${dl.dataset.d}"]`); return;
    }
    const rm = t.closest('[data-remove]');
    if (rm) {
      const i = Number(rm.dataset.remove);
      state.basket.splice(i, 1); save('basket', state.basket); renderBag(); renderBagCount();
      refocusBag(state.basket.length ? `[data-remove="${Math.min(i, state.basket.length - 1)}"]` : '.x');
      toast(SITE.words.removed); return;
    }
    if (t.closest('#checkout')) { $('#bag-note').textContent = SITE.words.checkoutNote; return; }
    // A click on the dialog's own backdrop closes it.
    if (t.matches('dialog.dlg')) { const r = t.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) { if (t.id === 'dlg-book') leaveBook(); else t.close(); } }
  });

  document.addEventListener('change', e => {
    if (e.target.name === 'fmt') { chosen = e.target.value; qty = 1; syncAdd(); }
  });

  function leaveBook() {
    if (openedInApp && history.length > 1) { openedInApp = false; history.back(); }
    else { location.hash = lastList; }
  }
  $('#dlg-book').addEventListener('cancel', e => { e.preventDefault(); leaveBook(); });

  let qTimer;
  $('#q').addEventListener('input', e => {
    const was = state.q;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      state.q = e.target.value;
      renderCatalogue();
      if (!was.trim() && state.q.trim()) scrollToCatalogue();
    }, 90);
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName) && !document.querySelector('dialog[open]')) { e.preventDefault(); $('#q').focus(); }
  });
  window.addEventListener('hashchange', route);

  // ---------- go ----------
  document.title = SITE.title;
  renderCatalogue();
  renderBagCount();
  route();
  requestAnimationFrame(() => document.documentElement.classList.add('ready'));
})();
</script>
</body>
</html>
